includes:
  - configs/tsc/base.yml


model:
  name: fixedtime
  t_fixed: 30
  train_model: False
  test_model: True
  load_model: False
  # 真实配时：启用后用 JSON 中的实际绿灯时长替代 t_fixed
  real_timing:
    json_path: utils/sumo_signal_reference_ezhou_vehicle_compact.json
    # 仿真 t=0 对应的现实一天中第几秒；25200 = 早上 7:00
    start_second_of_day: 25200

trainer:
  episodes: 1
  buffer_size: 0
  action_interval: 10
  learning_rate: 0
  learning_start: 0
  update_model_rate: 0
  update_target_rate: 0


logger:
  save_rate: 1
  train_model: False
  test_model: True
  load_model: False
