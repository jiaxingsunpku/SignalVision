<div class="tool-panel" id="realtime-traffic-data-tool-panel">
    <div class="tool-header">
        <h2>📊 实时交通数据</h2>
        <div class="tool-header-info">
            <span class="header-badge">TDengine</span>
            <span class="header-text">查看实时交通数据与数据库面板</span>
        </div>
        <button class="close-btn" onclick="dashboard.closeTool()">×</button>
    </div>
    
    <div class="tool-content">
        <div class="tdengine-container">
            <div class="tdengine-info" id="tdengine-loading">
                <div class="loading-spinner">⏳</div>
                <p>正在连接 TDengine 数据管理界面...</p>
                <p class="info-text">地址: <span id="tdengine-url"></span></p>
                <p class="info-text">如无法显示，请确认 TDengine 服务已启动</p>
            </div>
            <iframe id="tdengine-iframe" class="tdengine-iframe" frameborder="0" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
        </div>
    </div>
</div>
