<div class="tool-panel" id="models-tool-panel">
    <div class="tool-header">
        <h2>🗂️ 模型管理</h2>
        <div class="tool-header-info">
            <span class="header-badge">按算法分组</span>
            <span class="header-text">浏览训练模型、指标与权重文件</span>
        </div>
        <button class="close-btn" onclick="dashboard.closeTool()">×</button>
    </div>

    <div class="tool-content models-content">
        <aside class="models-sidebar">
            <div class="models-filter">
                <input type="text" id="model-search" placeholder="搜索模型 / 路网 / 算法..." class="search-input">
            </div>

            <div class="models-summary" id="models-summary">
                <div class="model-summary-card">
                    <div class="model-summary-label">模型总数</div>
                    <div class="model-summary-value" id="models-total-count">--</div>
                </div>
                <div class="model-summary-card">
                    <div class="model-summary-label">已训练模型</div>
                    <div class="model-summary-value" id="models-trained-count">--</div>
                </div>
            </div>

            <div class="algorithm-nav" id="algorithm-nav">
                <div class="loading-message">加载中...</div>
            </div>
        </aside>

        <main class="models-main">
            <section class="models-overview" id="models-overview">
                <div class="models-overview-header">
                    <div>
                        <h3 id="models-overview-title">模型分组</h3>
                        <p id="models-overview-subtitle">按算法查看模型、路网与训练状态</p>
                    </div>
                    <button class="model-secondary-btn" type="button" id="models-clear-filter-btn">查看全部</button>
                </div>

                <div class="models-group-board" id="models-group-board">
                    <div class="loading-message">加载中...</div>
                </div>
            </section>

            <section class="models-detail" id="models-detail">
                <div class="detail-placeholder" id="detail-placeholder">
                    <div class="placeholder-icon">📦</div>
                    <p>选择一个模型查看详情</p>
                </div>

                <div class="detail-content" id="detail-content" style="display: none;">
                    <button class="model-back-btn" type="button" id="models-back-btn">← 返回模型分组</button>

                    <div class="detail-header">
                        <h3 id="detail-title">模型名称</h3>
                        <div class="detail-badges">
                            <span class="badge badge-algorithm" id="detail-algorithm"></span>
                            <span class="badge badge-status" id="detail-status"></span>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h4>📊 训练指标</h4>
                        <div class="metrics-container">
                            <img id="metrics-image" class="metrics-image" alt="训练指标图">
                            <div class="metrics-error" id="metrics-error" style="display: none;">
                                <p>无训练指标图</p>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h4>⚙️ 训练参数</h4>
                        <div class="params-grid" id="params-grid">
                            <div class="loading-message">加载中...</div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h4>📁 模型文件</h4>
                        <div class="files-info" id="files-info"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
