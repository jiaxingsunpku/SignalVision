<div class="tool-panel" id="continual-learning-tool-panel">
    <div class="tool-header">
        <h2>📊 持续学习</h2>
        <div class="tool-header-info">
            <span class="header-badge">持续学习</span>
            <span class="header-text">持续评估、迭代与管理模型能力</span>
        </div>
        <button class="close-btn" onclick="dashboard.closeTool()">×</button>
    </div>
    
    <div class="tool-content comparison-tool-content">
        <!-- 左侧：任务配置 -->
        <div class="comparison-config-panel">
            <div class="config-section">
                <h3>📝 任务信息</h3>
                <div class="form-group">
                    <label>任务名称 *</label>
                    <input type="text" id="experiment-name" class="form-input" placeholder="例如: model_comparison_001" required>
                    <span class="form-hint">用于保存持续学习任务结果</span>
                </div>
                
                <div class="form-group">
                    <label>任务描述</label>
                    <textarea id="experiment-description" class="form-textarea" placeholder="描述本次持续学习任务的目标和预期..." rows="3"></textarea>
                </div>
            </div>
            
            <div class="config-section">
                <h3>🗺️ 测试场景</h3>
                <div class="form-group">
                    <label>场景</label>
                    <select id="test-scenario" class="form-select">
                        <option value="">加载中...</option>
                    </select>
                    <span class="form-hint">将从系统自动加载可用地图</span>
                </div>
                
                <div class="form-group">
                    <label>交通需求</label>
                    <select id="test-demand" class="form-select">
                        <option value="onfly" selected>在线生成 (LibSignal默认)</option>
                        <option value="json_flow">JSON Flow</option>
                        <option value="fixed">固定需求</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>仿真步数</label>
                        <input type="number" id="test-sim-length" class="form-input" value="3600" min="600" step="100">
                        <span class="form-hint">LibSignal使用仿真步数而非秒数</span>
                    </div>
                    
                    <div class="form-group">
                        <label>交通规模</label>
                        <input type="number" id="test-traffic-scale" class="form-input" value="2.0" min="0.1" max="10.0" step="0.1">
                    </div>
                </div>
            </div>
            
            <div class="config-section">
                <h3>🎯 学习模型（可选）</h3>
                <div id="comparison-models-list" class="models-selection-list">
                    <!-- 模型选择项将动态添加 -->
                </div>
                <button type="button" class="add-item-btn-large" onclick="dashboard.addComparisonModel()">
                    + 添加学习模型
                </button>
            </div>
            
            <div class="config-section">
                <h3>📐 基准算法</h3>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" class="baseline-checkbox" value="fixedtime" checked>
                        <span class="checkbox-label">Fixed Time</span>
                    </label>
                    
                    <label class="checkbox-item">
                        <input type="checkbox" class="baseline-checkbox" value="maxpressure" checked>
                        <span class="checkbox-label">Max Pressure</span>
                    </label>
                </div>
                <span class="form-hint">系统当前支持的基准算法</span>
            </div>
            
            <div class="config-section">
                <h3>📈 评估指标</h3>
                <div class="checkbox-group checkbox-grid">
                    <label class="checkbox-item">
                        <input type="checkbox" class="metric-checkbox" value="travel_time" checked>
                        <span class="checkbox-label">平均行程时间</span>
                    </label>
                    
                    <label class="checkbox-item">
                        <input type="checkbox" class="metric-checkbox" value="queue_length" checked>
                        <span class="checkbox-label">队列长度</span>
                    </label>
                    
                    <label class="checkbox-item">
                        <input type="checkbox" class="metric-checkbox" value="delay" checked>
                        <span class="checkbox-label">延迟</span>
                    </label>
                    
                    <label class="checkbox-item">
                        <input type="checkbox" class="metric-checkbox" value="throughput" checked>
                        <span class="checkbox-label">通行量</span>
                    </label>
                </div>
                <span class="form-hint">用于持续评估的标准指标</span>
            </div>
            
            <div class="action-buttons">
                <button class="primary-btn" onclick="dashboard.startComparison()">
                    <span>▶</span> 开始持续学习
                </button>
                <button class="secondary-btn" onclick="dashboard.loadDefaultComparisonConfig()">
                    <span>↺</span> 重置配置
                </button>
            </div>
        </div>
        
        <!-- 右侧：任务状态和结果 -->
        <div class="comparison-status-panel">
            <!-- 占位符 -->
            <div id="comparison-status-placeholder" class="status-placeholder">
                <div class="placeholder-icon">📊</div>
                <h3>准备持续学习</h3>
                <p>配置左侧参数后点击"开始持续学习"</p>
            </div>
            
            <!-- 任务状态 -->
            <div id="comparison-status-content" class="status-active-content" style="display: none;">
                <div class="status-header">
                    <div class="status-info">
                        <h3>任务状态</h3>
                        <span id="comparison-status-badge" class="status-badge preparing">准备中</span>
                    </div>
                    <button id="stop-comparison-btn" class="danger-btn-small" onclick="dashboard.stopComparison()">
                        <span>■</span> 停止
                    </button>
                </div>
                
                <!-- 总体进度 -->
                <div class="progress-section">
                    <div class="progress-header">
                        <span class="progress-label">总体进度</span>
                        <span id="overall-progress-text" class="progress-value">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div id="overall-progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- 各模型运行状态 -->
                <div class="models-progress-section">
                    <h4 class="section-title">运行状态</h4>
                    <div id="models-progress-list" class="models-progress-list">
                        <!-- 动态添加各模型的进度 -->
                    </div>
                </div>
                
                <!-- 任务日志 -->
                <div class="log-section">
                    <h4 class="section-title">任务日志</h4>
                    <div id="comparison-log" class="log-terminal"></div>
                </div>
                
                <!-- 结果可视化 -->
                <div id="comparison-results-viz" class="results-section" style="display: none;">
                    <h4 class="section-title">学习结果</h4>
                    <div id="comparison-charts-container" class="charts-container">
                        <!-- 结果图表将在这里显示 -->
                    </div>
                    <div class="results-actions">
                        <button class="secondary-btn" onclick="dashboard.exportComparisonResults()">
                            <span>📥</span> 导出数据
                        </button>
                        <button class="secondary-btn" onclick="dashboard.downloadComparisonReport()">
                            <span>📄</span> 生成报告
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
